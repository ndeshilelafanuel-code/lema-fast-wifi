databases:
  - name: lema-db
    databaseName: lema_fast_wifi
    user: lema_admin
    plan: free
    region: frankfurt

services:
  - type: web
    name: lema-fast-wifi-bot
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lema-db
          property: connectionString
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: OMADA_URL
        sync: false
      - key: OMADA_ID
        sync: false
      - key: OMADA_OPERATOR
        sync: false
      - key: OMADA_OPERATOR_PASSWORD
        sync: false
      - key: OMADA_ADMIN_USER
        sync: false
      - key: OMADA_ADMIN_PASSWORD
        sync: false
      - key: PAYMENTS_ENABLED
        sync: false

